[package]
name        = "rln-membership-zone"
description = "The RLN Membership Zone node: derives the membership tree from the registration program on LEZ; as the sequencer publishes batches on the Zone channel, as an indexer reads and checks them; serves roots and Merkle proof paths over HTTP"
edition     = "2024"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/logos-co/logos-rln-membership-zone"
version     = "0.1.0"
publish     = false
default-run = "zone"

[[bin]]
name = "zone"
path = "src/main.rs"

[dependencies]
# logos-blockchain crates (unpublished), pinned to the node release in use by git tag; the
# tag and rust-toolchain.toml move together with the node
lb-common-http-client            = { default-features = false, package = "logos-blockchain-common-http-client", git = "https://github.com/logos-blockchain/logos-blockchain", tag = "0.3.2" }
lb-core                          = { default-features = false, package = "logos-blockchain-core", git = "https://github.com/logos-blockchain/logos-blockchain", tag = "0.3.2" }
lb-key-management-system-service = { default-features = false, package = "logos-blockchain-key-management-system-service", git = "https://github.com/logos-blockchain/logos-blockchain", tag = "0.3.2" }
lb-zone-sdk                      = { default-features = false, package = "logos-blockchain-zone-sdk", git = "https://github.com/logos-blockchain/logos-blockchain", tag = "0.3.2" }

# the registration program's layouts (instructions, events, membership timing), from the
# program's own repository: branch feat/rln-zone-events, the revision the testnet program
# was deployed from (its rln-layouts sources are byte-identical to the earlier pin)
rln-layouts   = { git = "https://github.com/logos-co/logos-lez-rln", rev = "15ff472a0e9b9b4b2c5da3ecab5b7cbd9d5a5a87" }

# RLN (Zerokit, published 3.0.0: Poseidon BN254, Merkle trees, identity keys)
rln           = { default-features = false, version = "3.0.0" }
zerokit_utils = { default-features = false, version = "3.0.0" }

# third party
anyhow             = "1"
base64             = "0.22"
borsh              = "1"
axum               = { default-features = false, features = ["http1", "json", "query", "tokio"], version = "0.8" }
clap               = { features = ["derive", "env", "std"], version = "4" }
hex                = { features = ["serde"], version = "0.4" }
prost              = "0.13"
rand               = "0.8"
reqwest            = { default-features = false, features = ["json", "rustls-tls"], version = "0.12" }
serde              = { features = ["derive"], version = "1" }
sha2               = "0.10"
serde_json         = "1"
tokio              = { features = ["macros", "rt-multi-thread", "signal", "sync", "time"], version = "1" }
tracing            = "0.1"
tracing-subscriber = { features = ["env-filter"], version = "0.3" }
