[package]
name        = "rln-zone-poc"
description = "PoC of the RLN Membership Zone: a Zone sequencer on the Logos testnet that derives the tree from the registration program's events and serves roots and Merkle proof paths over HTTP"
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }
publish     = false

[dependencies]
anyhow                           = { workspace = true }
axum                             = { workspace = true }
clap                             = { workspace = true }
hex                              = { features = ["serde"], workspace = true }
lb-common-http-client            = { workspace = true }
lb-core                          = { workspace = true }
lb-key-management-system-service = { workspace = true }
lb-zone-sdk                      = { workspace = true }
prost                            = { workspace = true }
rand                             = { workspace = true }
reqwest                          = { workspace = true }
rln                              = { workspace = true }
serde                            = { workspace = true }
serde_json                       = { workspace = true }
sha2                             = { workspace = true }
tokio                            = { workspace = true }
tracing                          = { workspace = true }
tracing-subscriber               = { workspace = true }
zerokit_utils                    = { workspace = true }
